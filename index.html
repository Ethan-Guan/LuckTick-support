<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LuckTick Support</title>
<link rel="stylesheet" href="style.css">
<script>
(function () {
  var map = [["zh", "zh-Hans"], ["ja", "ja"], ["ko", "ko"]];
  var prefs = navigator.languages || [navigator.language || "en"];
  var target = "en";
  outer: for (var i = 0; i < prefs.length; i++) {
    var p = (prefs[i] || "").toLowerCase();
    if (p.indexOf("en") === 0) break;
    for (var j = 0; j < map.length; j++) {
      if (p.indexOf(map[j][0]) === 0) { target = map[j][1]; break outer; }
    }
  }
  location.replace(target + "/index.html" + location.hash);
})();
</script>
</head>
<body>
<main class="wrap">
<h1>LuckTick Support</h1>
<p><a href="zh-Hans/index.html" lang="zh-Hans">简体中文</a> · <a href="en/index.html" lang="en">English</a> · <a href="ja/index.html" lang="ja">日本語</a> · <a href="ko/index.html" lang="ko">한국어</a></p>
</main>
</body>
</html>
